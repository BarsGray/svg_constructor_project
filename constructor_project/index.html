<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конструктор сверла</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 30px;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    input {
      width: 100px;
      padding: 6px;
    }
    /* Контейнер SVG */
    .svg-container {
      width: 100%;
      max-width: 1200px;
      height: 400px;
      border: 1px solid #ccc;
      overflow: hidden;
    }
    /* SVG занимает весь контейнер */
    #drill {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Центральная ось */
    .axis {
      stroke: #999;
      stroke-width: 0.3;
      stroke-dasharray: 2 2;
    }
    /* Сверло */
    .drill {
      stroke: black;
      stroke-width: 0.5;
      fill: none;
    }
    /* Размерная линия */
    .dimension {
      stroke: #555;
      stroke-width: 0.25;
    }
    /* Текст */
    text {
      font-size: 3px;
      fill: #333;
    }
  </style>
</head>
<body>
  <h2>Конструктор сверла</h2>
  <div class="controls">
    <label>Диаметр, мм<input id="diameter" type="number" value="10" min="1" step="0.1"></label>

    <label>Длина рабочей части, мм<input id="workingLength" type="number" value="100" min="1" step="1"></label>

    <label>Длина хвостовика, мм<input id="shankLength" type="number" value="50" min="1" step="1"></label>

    <label>Угол заточки, °<input id="angle" type="number" value="118" min="1" max="179" step="1"></label>
  </div>

  <div class="svg-container">
    <svg id="drill" preserveAspectRatio="xMidYMid meet">
      <!-- Центральная ось -->
      <line id="axis" class="axis" />
      <!-- Верхняя режущая кромка -->
      <line id="edgeTop" class="drill" />
      <!-- Нижняя режущая кромка -->
      <line id="edgeBottom" class="drill" />
      <!-- Верхняя сторона рабочей части -->
      <line id="bodyTop" class="drill" />
      <!-- Нижняя сторона рабочей части -->
      <line id="bodyBottom" class="drill" />
      <!-- Верх хвостовика -->
      <line id="shankTop" class="drill" />
      <!-- Низ хвостовика -->
      <line id="shankBottom" class="drill" />
      <!-- Размер диаметра -->
      <line id="diameterLine" class="dimension" />
      <text id="diameterText"></text>
    </svg>
  </div>
  <script>
    // ============================================================
    // Элементы управления
    // ============================================================
    const diameterInput = document.querySelector('#diameter');
    const workingLengthInput = document.querySelector('#workingLength');
    const shankLengthInput = document.querySelector('#shankLength');
    const angleInput = document.querySelector('#angle');

    // ============================================================
    // SVG
    // ============================================================
    const svg = document.querySelector('#drill');

    // ============================================================
    // Линии
    // ============================================================
    const axis = document.querySelector('#axis');
    const edgeTop = document.querySelector('#edgeTop');
    const edgeBottom = document.querySelector('#edgeBottom');
    const bodyTop = document.querySelector('#bodyTop');
    const bodyBottom = document.querySelector('#bodyBottom');
    const shankTop = document.querySelector('#shankTop');
    const shankBottom = document.querySelector('#shankBottom');
    const diameterLine = document.querySelector('#diameterLine');
    const diameterText = document.querySelector('#diameterText');


    // ============================================================
    // Отрисовка
    // ============================================================
    function renderDrill() {

      // ========================================================
      // Получаем значения
      // ========================================================
      const diameter = Number(diameterInput.value);
      const workingLength = Number(workingLengthInput.value);
      const shankLength = Number(shankLengthInput.value);
      const angle = Number(angleInput.value);

      // ========================================================
      // Радиус
      // ========================================================
      const radius = diameter / 2;

      // ========================================================
      // Переводим угол в радианы
      // ========================================================
      const angleRad = angle * Math.PI / 180;

      // ========================================================
      // Половина угла вершины
      // ========================================================
      const halfAngle = angleRad / 2;

      // ========================================================
      // Длина конуса вершины
      //
      // R / tan(угол / 2)
      // ========================================================
      const pointLength = radius / Math.tan(halfAngle);

      // ========================================================
      // Координаты
      // ========================================================
      const tipX = 0;
      const centerY = 0;
      const shoulderX = pointLength;
      const workingEndX = shoulderX + workingLength;
      const shankEndX = workingEndX + shankLength;

      // ========================================================
      // Размерная линия
      // ========================================================
      const dimensionX = shankEndX + Math.max(5, diameter);

      // ========================================================
      // Общая ширина
      //
      // Добавляем отступ слева и справа
      // ========================================================
      const paddingX = Math.max(10, shankEndX * 0.05);
      const minX = -paddingX;
      const maxX = dimensionX + paddingX;
      const viewWidth = maxX - minX;

      // ========================================================
      // Высота
      //
      // Диаметр + место для размерной линии
      // ========================================================
      const paddingY = Math.max(10, diameter);
      const minY = -radius - paddingY;
      const maxY = radius + paddingY;
      const viewHeight = maxY - minY;

      // ========================================================
      // Устанавливаем viewBox
      // ========================================================

      svg.setAttribute( 'viewBox', `${minX} ${minY} ${viewWidth} ${viewHeight}` );

      // ========================================================
      // Центральная ось
      // ========================================================
      axis.setAttribute('x1', minX);
      axis.setAttribute('y1', centerY);
      axis.setAttribute('x2', maxX);
      axis.setAttribute('y2', centerY);

      // ========================================================
      // Верхняя режущая кромка
      // ========================================================
      edgeTop.setAttribute( 'x1', tipX );
      edgeTop.setAttribute( 'y1', centerY );
      edgeTop.setAttribute( 'x2', shoulderX );
      edgeTop.setAttribute( 'y2', -radius );

      // ========================================================
      // Нижняя режущая кромка
      // ========================================================
      edgeBottom.setAttribute( 'x1', tipX );
      edgeBottom.setAttribute( 'y1', centerY );
      edgeBottom.setAttribute( 'x2', shoulderX );
      edgeBottom.setAttribute( 'y2', radius );

      // ========================================================
      // Верх рабочей части
      // ========================================================
      bodyTop.setAttribute( 'x1', shoulderX );
      bodyTop.setAttribute( 'y1', -radius );
      bodyTop.setAttribute( 'x2', workingEndX );
      bodyTop.setAttribute( 'y2', -radius );

      // ========================================================
      // Низ рабочей части
      // ========================================================
      bodyBottom.setAttribute( 'x1', shoulderX );
      bodyBottom.setAttribute( 'y1', radius );
      bodyBottom.setAttribute( 'x2', workingEndX );
      bodyBottom.setAttribute( 'y2', radius );

      // ========================================================
      // Верх хвостовика
      // ========================================================
      shankTop.setAttribute( 'x1', workingEndX );
      shankTop.setAttribute( 'y1', -radius );
      shankTop.setAttribute( 'x2', shankEndX );
      shankTop.setAttribute( 'y2', -radius );

      // ========================================================
      // Низ хвостовика
      // ========================================================
      shankBottom.setAttribute( 'x1', workingEndX );
      shankBottom.setAttribute( 'y1', radius );
      shankBottom.setAttribute( 'x2', shankEndX );
      shankBottom.setAttribute( 'y2', radius );

      // ========================================================
      // Размерная линия диаметра
      // ========================================================
      diameterLine.setAttribute( 'x1', dimensionX );
      diameterLine.setAttribute( 'y1', -radius );
      diameterLine.setAttribute( 'x2', dimensionX );
      diameterLine.setAttribute( 'y2', radius );

      // ========================================================
      // Текст диаметра
      // ========================================================
      diameterText.setAttribute( 'x', dimensionX + 2 );
      diameterText.setAttribute( 'y', 1 );
      diameterText.textContent = `Ø ${diameter} мм`;
    }

    // ============================================================
    // События
    // ============================================================
    diameterInput.addEventListener('input',renderDrill);
    workingLengthInput.addEventListener('input',renderDrill);
    shankLengthInput.addEventListener('input',renderDrill);
    angleInput.addEventListener('input',renderDrill);

    // ============================================================
    // Первый запуск
    // ============================================================
    renderDrill()
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор сверла</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        label {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        input {
            width: 100px;
            padding: 6px;
        }

        svg {
            width: 100%;
            max-width: 900px;
            height: 300px;
            border: 1px solid #ccc;
            display: block;
        }

        .axis {
            stroke: #999;
            stroke-width: 0.3;
            stroke-dasharray: 2 2;
        }

        .drill {
            stroke: black;
            stroke-width: 0.5;
            fill: none;
        }

        .dimension {
            stroke: #555;
            stroke-width: 0.25;
        }

        text {
            font-size: 3px;
            fill: #333;
        }
    </style>
</head>

<body>

<h2>Конструктор сверла</h2>

<div class="controls">

    <label>
        Диаметр, мм
        <input id="diameter" type="number" value="10" min="1" step="0.1">
    </label>

    <label>
        Длина рабочей части, мм
        <input id="workingLength" type="number" value="100" min="1" step="1">
    </label>

    <label>
        Длина хвостовика, мм
        <input id="shankLength" type="number" value="50" min="1" step="1">
    </label>

    <label>
        Угол заточки, °
        <input id="angle" type="number" value="118" min="1" max="179" step="1">
    </label>

</div>


<svg
    id="drill"
    viewBox="-10 -20 170 40"
    preserveAspectRatio="xMidYMid meet"
>

    <!-- Центральная ось -->
    <line
        id="axis"
        class="axis"
        x1="-10"
        y1="0"
        x2="170"
        y2="0"
    />

    <!-- Верхняя режущая кромка -->
    <line
        id="edgeTop"
        class="drill"
    />

    <!-- Нижняя режущая кромка -->
    <line
        id="edgeBottom"
        class="drill"
    />

    <!-- Верхняя сторона рабочей части -->
    <line
        id="bodyTop"
        class="drill"
    />

    <!-- Нижняя сторона рабочей части -->
    <line
        id="bodyBottom"
        class="drill"
    />

    <!-- Верх хвостовика -->
    <line
        id="shankTop"
        class="drill"
    />

    <!-- Низ хвостовика -->
    <line
        id="shankBottom"
        class="drill"
    />

    <!-- Размер диаметра -->
    <line
        id="diameterLine"
        class="dimension"
    />

    <text
        id="diameterText"
    />

</svg>


<script>

const diameterInput = document.querySelector('#diameter');
const workingLengthInput = document.querySelector('#workingLength');
const shankLengthInput = document.querySelector('#shankLength');
const angleInput = document.querySelector('#angle');

const edgeTop = document.querySelector('#edgeTop');
const edgeBottom = document.querySelector('#edgeBottom');

const bodyTop = document.querySelector('#bodyTop');
const bodyBottom = document.querySelector('#bodyBottom');

const shankTop = document.querySelector('#shankTop');
const shankBottom = document.querySelector('#shankBottom');

const diameterLine = document.querySelector('#diameterLine');
const diameterText = document.querySelector('#diameterText');


function renderDrill() {

    // -------------------------
    // Получаем параметры
    // -------------------------

    const diameter = Number(diameterInput.value);
    const workingLength = Number(workingLengthInput.value);
    const shankLength = Number(shankLengthInput.value);
    const angle = Number(angleInput.value);


    // -------------------------
    // Геометрия
    // -------------------------

    const radius = diameter / 2;

    const angleRad = angle * Math.PI / 180;

    /*
        Половина угла вершины.

        Например:

        угол = 118°
        половина = 59°
    */

    const halfAngle = angleRad / 2;


    /*
        Расстояние от вершины
        до полной ширины диаметра.

             /\
            /  \
           /    \
          /      \
         /        \
        └──────────┘
           radius

        pointLength =
            radius / tan(angle / 2)
    */

    const pointLength =
        radius / Math.tan(halfAngle);


    // -------------------------
    // Координаты
    // -------------------------

    const tipX = 0;
    const centerY = 0;

    const shoulderX = pointLength;

    const workingEndX =
        pointLength + workingLength;

    const shankEndX =
        workingEndX + shankLength;


    // -------------------------
    // Режущие кромки
    // -------------------------

    edgeTop.setAttribute('x1', tipX);
    edgeTop.setAttribute('y1', centerY);

    edgeTop.setAttribute('x2', shoulderX);
    edgeTop.setAttribute('y2', -radius);


    edgeBottom.setAttribute('x1', tipX);
    edgeBottom.setAttribute('y1', centerY);

    edgeBottom.setAttribute('x2', shoulderX);
    edgeBottom.setAttribute('y2', radius);


    // -------------------------
    // Рабочая часть
    // -------------------------

    bodyTop.setAttribute('x1', shoulderX);
    bodyTop.setAttribute('y1', -radius);

    bodyTop.setAttribute('x2', workingEndX);
    bodyTop.setAttribute('y2', -radius);


    bodyBottom.setAttribute('x1', shoulderX);
    bodyBottom.setAttribute('y1', radius);

    bodyBottom.setAttribute('x2', workingEndX);
    bodyBottom.setAttribute('y2', radius);


    // -------------------------
    // Хвостовик
    // -------------------------

    shankTop.setAttribute('x1', workingEndX);
    shankTop.setAttribute('y1', -radius);

    shankTop.setAttribute('x2', shankEndX);
    shankTop.setAttribute('y2', -radius);


    shankBottom.setAttribute('x1', workingEndX);
    shankBottom.setAttribute('y1', radius);

    shankBottom.setAttribute('x2', shankEndX);
    shankBottom.setAttribute('y2', radius);


    // -------------------------
    // Размер диаметра
    // -------------------------

    const dimensionX = shankEndX + 5;

    diameterLine.setAttribute(
        'x1',
        dimensionX
    );

    diameterLine.setAttribute(
        'y1',
        -radius
    );

    diameterLine.setAttribute(
        'x2',
        dimensionX
    );

    diameterLine.setAttribute(
        'y2',
        radius
    );


    diameterText.setAttribute(
        'x',
        dimensionX + 2
    );

    diameterText.setAttribute(
        'y',
        1
    );

    diameterText.textContent =
        `Ø ${diameter} мм`;

}


// Обновляем при изменении параметров

diameterInput.addEventListener(
    'input',
    renderDrill
);

workingLengthInput.addEventListener(
    'input',
    renderDrill
);

shankLengthInput.addEventListener(
    'input',
    renderDrill
);

angleInput.addEventListener(
    'input',
    renderDrill
);


// Первоначальная отрисовка

renderDrill();

</script>

</body>
</html>

  <style>
    body {
      font-family: Arial, sans-serif;

      gap: 20px;

      width: 100%;

      overflow: hidden;
    }

    #drill {
      width: 100%;
      height: 100%;
      display: block;
    }

      stroke: #999;

      fill: #333;
    }

<body>
  <h2>Конструктор сверла</h2>
  <div class="controls">
    <label>Диаметр, мм<input id="diameter" type="number" value="10" min="1" step="0.1"></label>

    <label>Длина рабочей части, мм<input id="workingLength" type="number" value="100" min="1" step="1"></label>

    <label>Длина хвостовика, мм<input id="shankLength" type="number" value="50" min="1" step="1"></label>

    <label>Угол заточки, °<input id="angle" type="number" value="118" min="1" max="179" step="1"></label>
  </div>

  <div class="svg-container">
    <svg id="drill" preserveAspectRatio="xMidYMid meet">
      <!-- Центральная ось -->
      <line id="axis" class="axis" />
      <!-- Верхняя режущая кромка -->
      <line id="edgeTop" class="drill" />
      <!-- Нижняя режущая кромка -->
      <line id="edgeBottom" class="drill" />
      <!-- Верхняя сторона рабочей части -->
      <line id="bodyTop" class="drill" />
      <!-- Нижняя сторона рабочей части -->
      <line id="bodyBottom" class="drill" />
      <!-- Верх хвостовика -->
      <line id="shankTop" class="drill" />
      <!-- Низ хвостовика -->
      <line id="shankBottom" class="drill" />
      <!-- Размер диаметра -->
      <line id="diameterLine" class="dimension" />
      <text id="diameterText"></text>
    </svg>
  </div>
  <script>
    // ============================================================
    // Элементы управления
    // ============================================================
    const diameterInput = document.querySelector('#diameter');
    const workingLengthInput = document.querySelector('#workingLength');
    const shankLengthInput = document.querySelector('#shankLength');
    const angleInput = document.querySelector('#angle');

    // ============================================================
    // SVG
    // ============================================================
    const svg = document.querySelector('#drill');

    // ============================================================
    // Линии
    // ============================================================
    const axis = document.querySelector('#axis');
    const edgeTop = document.querySelector('#edgeTop');
    const edgeBottom = document.querySelector('#edgeBottom');
    const bodyTop = document.querySelector('#bodyTop');
    const bodyBottom = document.querySelector('#bodyBottom');
    const shankTop = document.querySelector('#shankTop');
    const shankBottom = document.querySelector('#shankBottom');
    const diameterLine = document.querySelector('#diameterLine');
    const diameterText = document.querySelector('#diameterText');


    // ============================================================
    // Отрисовка
    // ============================================================
    function renderDrill() {

      // ========================================================
      // Получаем значения
      // ========================================================
      const diameter = Number(diameterInput.value);
      const workingLength = Number(workingLengthInput.value);
      const shankLength = Number(shankLengthInput.value);
      const angle = Number(angleInput.value);

      // ========================================================
      // Радиус
      // ========================================================
      const radius = diameter / 2;

      // ========================================================
      // Переводим угол в радианы
      // ========================================================
      const angleRad = angle * Math.PI / 180;

      // ========================================================
      // Половина угла вершины
      // ========================================================
      const halfAngle = angleRad / 2;

      // ========================================================
      // Длина конуса вершины
      //
      // R / tan(угол / 2)
      // ========================================================
      const pointLength = radius / Math.tan(halfAngle);

      // ========================================================
      // Координаты
      // ========================================================
      const tipX = 0;
      const centerY = 0;
      const shoulderX = pointLength;
      const workingEndX = shoulderX + workingLength;
      const shankEndX = workingEndX + shankLength;

      // ========================================================
      // Размерная линия
      // ========================================================
      const dimensionX = shankEndX + Math.max(5, diameter);

      // ========================================================
      // Общая ширина
      //
      // Добавляем отступ слева и справа
      // ========================================================
      const paddingX = Math.max(10, shankEndX * 0.05);
      const minX = -paddingX;
      const maxX = dimensionX + paddingX;
      const viewWidth = maxX - minX;

      // ========================================================
      // Высота
      //
      // Диаметр + место для размерной линии
      // ========================================================
      const paddingY = Math.max(10, diameter);
      const minY = -radius - paddingY;
      const maxY = radius + paddingY;
      const viewHeight = maxY - minY;

      // ========================================================
      // Устанавливаем viewBox
      // ========================================================

      svg.setAttribute( 'viewBox', `${minX} ${minY} ${viewWidth} ${viewHeight}` );

      // ========================================================
      // Центральная ось
      // ========================================================
      axis.setAttribute('x1', minX);
      axis.setAttribute('y1', centerY);
      axis.setAttribute('x2', maxX);
      axis.setAttribute('y2', centerY);

      // ========================================================
      // Верхняя режущая кромка
      // ========================================================
      edgeTop.setAttribute( 'x1', tipX );
      edgeTop.setAttribute( 'y1', centerY );
      edgeTop.setAttribute( 'x2', shoulderX );
      edgeTop.setAttribute( 'y2', -radius );

      // ========================================================
      // Нижняя режущая кромка
      // ========================================================
      edgeBottom.setAttribute( 'x1', tipX );
      edgeBottom.setAttribute( 'y1', centerY );
      edgeBottom.setAttribute( 'x2', shoulderX );
      edgeBottom.setAttribute( 'y2', radius );

      // ========================================================
      // Верх рабочей части
      // ========================================================
      bodyTop.setAttribute( 'x1', shoulderX );
      bodyTop.setAttribute( 'y1', -radius );
      bodyTop.setAttribute( 'x2', workingEndX );
      bodyTop.setAttribute( 'y2', -radius );

      // ========================================================
      // Низ рабочей части
      // ========================================================
      bodyBottom.setAttribute( 'x1', shoulderX );
      bodyBottom.setAttribute( 'y1', radius );
      bodyBottom.setAttribute( 'x2', workingEndX );
      bodyBottom.setAttribute( 'y2', radius );

      // ========================================================
      // Верх хвостовика
      // ========================================================
      shankTop.setAttribute( 'x1', workingEndX );
      shankTop.setAttribute( 'y1', -radius );
      shankTop.setAttribute( 'x2', shankEndX );
      shankTop.setAttribute( 'y2', -radius );

      // ========================================================
      // Низ хвостовика
      // ========================================================
      shankBottom.setAttribute( 'x1', workingEndX );
      shankBottom.setAttribute( 'y1', radius );
      shankBottom.setAttribute( 'x2', shankEndX );
      shankBottom.setAttribute( 'y2', radius );

      // ========================================================
      // Размерная линия диаметра
      // ========================================================
      diameterLine.setAttribute( 'x1', dimensionX );
      diameterLine.setAttribute( 'y1', -radius );
      diameterLine.setAttribute( 'x2', dimensionX );
      diameterLine.setAttribute( 'y2', radius );

      // ========================================================
      // Текст диаметра
      // ========================================================
      diameterText.setAttribute( 'x', dimensionX + 2 );
      diameterText.setAttribute( 'y', 1 );
      diameterText.textContent = `Ø ${diameter} мм`;
    }

    // ============================================================
    // События
    // ============================================================
    diameterInput.addEventListener('input',renderDrill);
    workingLengthInput.addEventListener('input',renderDrill);
    shankLengthInput.addEventListener('input',renderDrill);
    angleInput.addEventListener('input',renderDrill);

    // ============================================================
    // Первый запуск
    // ============================================================
    renderDrill()
  </script>
</body>
</html>

  );

  );

  edgeTop.setAttribute(
    'x2',

  );

  edgeTop.setAttribute(

  );

  bodyBottom.setAttribute(
    'x2',

  );

  );

  shankTop.setAttribute(

  );

  shankTop.setAttribute(

  );

  shankBottom.setAttribute(
    'y2',
    radius
  );

  diameterLine.setAttribute(
    'x1',
    dimensionX
  );

  diameterLine.setAttribute(
    'y1',
    -radius
  );

  diameterLine.setAttribute(
    'x2',
    dimensionX
  );

  diameterLine.setAttribute(
    'y2',
    radius
  );


  // ==========================================================
  // Текст диаметра
  // ==========================================================

  diameterText.setAttribute(

  );

  diameterText.setAttribute(
    'y',
    1
  );

  diameterText.textContent =
    `Ø ${diameter} мм`;

}

      type="number"
      value="10"
      min="1"
      step="0.1"

  </label>


  <label>
    Длина рабочей части, мм

    <input
      id="workingLength"
      type="number"
      value="100"
      min="1"
      step="1"
    >
  </label>


  <label>
    Длина хвостовика, мм

    <input
      id="shankLength"
      type="number"
      value="50"
      min="1"
      step="1"
    >
  </label>


  <label>

    <input
      id="angle"
      type="number"
      value="118"
      min="1"
      max="179"
      step="1"
    >
  </label>


</div>


<div class="svg-container">


  <svg
    id="drill"
    preserveAspectRatio="xMidYMid meet"
  >


    <!-- =================================================
         DEFINITIONS
         ================================================= -->

    <defs>


      <!-- Сетка 5 × 5 мм -->

      <pattern
        id="grid"
        width="5"
        height="5"
        patternUnits="userSpaceOnUse"
      >

        <path
          d="M 5 0 L 0 0 L 0 5"
          fill="none"
          class="grid-line"
        />

      </pattern>


    </defs>


    <!-- =================================================
         ФОН
         ================================================= -->

    <rect
      id="gridBackground"
      fill="url(#grid)"
    />

      class="cutting-area"
    />

         ================================================= -->

      id="shankArea"
      class="shank-area"
    />


    <!-- =================================================
         ЛИНИИ СВЕРЛА
         ================================================= -->


    <!-- Верхняя режущая кромка -->

    <line
      id="edgeTop"
      class="drill"
    />


    <!-- Нижняя режущая кромка -->

    <line
      id="edgeBottom"
      class="drill"
    />


    <!-- Верхняя сторона рабочей части -->

      class="drill"

      id="bodyBottom"
      class="drill"
    />

      id="shankTop"
      class="drill"
    />

    <line
      id="shankBottom"
      class="drill"
    />


    <!-- =================================================
         РАЗМЕР ДИАМЕТРА
         ================================================= -->

      id="diameterLine"
      class="dimension"
    />


    <text
      id="diameterText"
    ></text>


  </svg>

</div>


<script>


// ============================================================
// INPUT
// ============================================================

const diameterInput =
  document.querySelector('#diameter');

const workingLengthInput =
  document.querySelector('#workingLength');

const shankLengthInput =
  document.querySelector('#shankLength');

const angleInput =
  document.querySelector('#angle');


// ============================================================
// SVG
// ============================================================

const svg =
  document.querySelector('#drill');


// ============================================================
// GRID
// ============================================================

const gridBackground =
  document.querySelector('#gridBackground');


// ============================================================
// ОБЛАСТИ
// ============================================================

const cuttingArea =
  document.querySelector('#cuttingArea');

const shankArea =
  document.querySelector('#shankArea');


// ============================================================
// ЛИНИИ
// ============================================================

const edgeTop =
  document.querySelector('#edgeTop');

const edgeBottom =
  document.querySelector('#edgeBottom');

const bodyTop =
  document.querySelector('#bodyTop');

const bodyBottom =
  document.querySelector('#bodyBottom');

const shankTop =
  document.querySelector('#shankTop');

const shankBottom =
  document.querySelector('#shankBottom');


// ============================================================
// РАЗМЕР
// ============================================================

const diameterLine =
  document.querySelector('#diameterLine');

const diameterText =
  document.querySelector('#diameterText');


// ============================================================
// RENDER
// ============================================================

function renderDrill() {


  // ==========================================================
  // ПАРАМЕТРЫ
  // ==========================================================

  const diameter =
    Number(diameterInput.value);

  const workingLength =
    Number(workingLengthInput.value);

  const shankLength =
    Number(shankLengthInput.value);

  const angle =
    Number(angleInput.value);


  // ==========================================================
  // РАДИУС
  // ==========================================================

  const radius =
    diameter / 2;


  // ==========================================================
  // УГОЛ
  // ==========================================================

  const angleRad =
    angle * Math.PI / 180;


  const halfAngle =
    angleRad / 2;


  // ==========================================================
  // ДЛИНА ВЕРШИНЫ
  // ==========================================================

  const pointLength =
    radius / Math.tan(halfAngle);


  // ==========================================================
  // КООРДИНАТЫ
  // ==========================================================

  const tipX = 0;

  const centerY = 0;


  const shoulderX =
    pointLength;


  const workingEndX =
    shoulderX + workingLength;


  const shankEndX =
    workingEndX + shankLength;


  // ==========================================================
  // РАЗМЕРНАЯ ЛИНИЯ
  // ==========================================================

  const dimensionX =
    shankEndX + Math.max(5, diameter);


  // ==========================================================
  // VIEWBOX
  // ==========================================================

  const paddingX =
    Math.max(10, shankEndX * 0.05);


  const minX =
    -paddingX;


  const maxX =
    dimensionX + paddingX;


  const viewWidth =
    maxX - minX;


  const paddingY =
    Math.max(10, diameter);


  const minY =
    -radius - paddingY;


  const maxY =
    radius + paddingY;


  const viewHeight =
    maxY - minY;


  svg.setAttribute(
    'viewBox',
    `${minX} ${minY} ${viewWidth} ${viewHeight}`
  );


  // ==========================================================
  // СЕТКА
  // ==========================================================

  gridBackground.setAttribute(
    'x',
    minX
  );

  gridBackground.setAttribute(
    'y',
    minY
  );

  gridBackground.setAttribute(
    'width',
    viewWidth
  );

  gridBackground.setAttribute(
    'height',
    viewHeight
  );


  // ==========================================================
  // КРАСНАЯ ОБЛАСТЬ
  // РЕЖУЩАЯ ЧАСТЬ
  // ==========================================================

  /*
  
      tip
       \
        \
         ┌──────────────
         │
         │
         └──────────────

  */

  cuttingArea.setAttribute(
    'd',

    `
      M ${tipX} ${centerY}

      L ${shoulderX} ${-radius}

      L ${workingEndX} ${-radius}

      L ${workingEndX} ${radius}

      L ${shoulderX} ${radius}

      Z
    `
  );


  // ==========================================================
  // ЗЕЛЁНАЯ ОБЛАСТЬ
  // ХВОСТОВИК
  // ==========================================================

  shankArea.setAttribute(
    'x',
    workingEndX
  );

  shankArea.setAttribute(
    'y',
    -radius
  );

  shankArea.setAttribute(
    'width',
    shankLength
  );

  shankArea.setAttribute(
    'height',
    diameter
  );


  // ==========================================================
  // ВЕРХНЯЯ РЕЖУЩАЯ КРОМКА
  // ==========================================================

  edgeTop.setAttribute(
    'x1',
    tipX
  );

  edgeTop.setAttribute(
    'y1',
    centerY
  );

  edgeTop.setAttribute(
    'x2',
    shoulderX
  );

  edgeTop.setAttribute(
    'y2',
    -radius
  );


  // ==========================================================
  // НИЖНЯЯ РЕЖУЩАЯ КРОМКА
  // ==========================================================

  edgeBottom.setAttribute(
    'x1',
    tipX
  );

  edgeBottom.setAttribute(
    'y1',
    centerY
  );

  edgeBottom.setAttribute(
    'x2',
    shoulderX
  );

  edgeBottom.setAttribute(
    'y2',
    radius
  );


  // ==========================================================
  // ВЕРХ РАБОЧЕЙ ЧАСТИ
  // ==========================================================

  bodyTop.setAttribute(
    'x1',
    shoulderX
  );

  bodyTop.setAttribute(
    'y1',
    -radius
  );

  bodyTop.setAttribute(
    'x2',
    workingEndX
  );

  bodyTop.setAttribute(
    'y2',
    -radius
  );


  // ==========================================================
  // НИЗ РАБОЧЕЙ ЧАСТИ
  // ==========================================================

  bodyBottom.setAttribute(
    'x1',
    shoulderX
  );

  bodyBottom.setAttribute(
    'y1',
    radius
  );

  bodyBottom.setAttribute(
    'x2',
    workingEndX
  );

  bodyBottom.setAttribute(
    'y2',
    radius
  );


  // ==========================================================
  // ВЕРХ ХВОСТОВИКА
  // ==========================================================

  shankTop.setAttribute(
    'x1',
    workingEndX
  );

  shankTop.setAttribute(
    'y1',
    -radius
  );

  shankTop.setAttribute(
    'x2',
    shankEndX
  );

  shankTop.setAttribute(
    'y2',
    -radius
  );


  // ==========================================================
  // НИЗ ХВОСТОВИКА
  // ==========================================================

  shankBottom.setAttribute(
    'x1',
    workingEndX
  );

  shankBottom.setAttribute(
    'y1',
    radius
  );

  shankBottom.setAttribute(
    'x2',
    shankEndX
  );

  shankBottom.setAttribute(
    'y2',
    radius
  );


  // ==========================================================
  // РАЗМЕРНАЯ ЛИНИЯ
  // ==========================================================

  diameterLine.setAttribute(
    'x1',
    dimensionX
  );

  diameterLine.setAttribute(
    'y1',
    -radius
  );

  diameterLine.setAttribute(
    'x2',
    dimensionX
  );

  diameterLine.setAttribute(
    'y2',
    radius
  );


  // ==========================================================
  // ТЕКСТ
  // ==========================================================

  diameterText.setAttribute(
    'x',
    dimensionX + 2
  );

  diameterText.setAttribute(
    'y',
    1
  );

  diameterText.textContent =
    `Ø ${diameter} мм`;

}


// ============================================================
// СОБЫТИЯ
// ============================================================

diameterInput.addEventListener(
  'input',
  renderDrill
);


workingLengthInput.addEventListener(
  'input',
  renderDrill
);


shankLengthInput.addEventListener(
  'input',
  renderDrill
);


angleInput.addEventListener(
  'input',
  renderDrill
);


// ============================================================
// ЗАПУСК
// ============================================================

renderDrill();

</script>

</body>
</html>

  // ==========================================================

  const cuttingDiameter =
    Number(cuttingDiameterInput.value);

  const shankDiameter =
    Number(shankDiameterInput.value);

  const workingLength =
    Number(workingLengthInput.value);

  const shankLength =
    Number(shankLengthInput.value);

  const angle =
    Number(angleInput.value);


  // ==========================================================
  // РАДИУСЫ
  // ==========================================================

  const cuttingRadius =
    cuttingDiameter / 2;

  const shankRadius =
    shankDiameter / 2;


  // ==========================================================
  // УГОЛ
  //
  // Угол рассчитывается ТОЛЬКО
  // от диаметра режущей части.
  // ==========================================================

  const angleRad =
    angle * Math.PI / 180;

  const halfAngle =
    angleRad / 2;


  // ==========================================================
  // ДЛИНА ВЕРШИНЫ
  // ==========================================================

  const pointLength =
    cuttingRadius /
    Math.tan(halfAngle);


  // ==========================================================
  // КООРДИНАТЫ
  // ==========================================================

  const tipX = 0;

  const centerY = 0;


  // Конец заточки

  const shoulderX =
    pointLength;


  // Конец рабочей части

  const workingEndX =
    shoulderX + workingLength;


  // Конец хвостовика

  const shankEndX =
    workingEndX + shankLength;


  // ==========================================================
  // РАЗМЕРНАЯ ЛИНИЯ
  // ==========================================================

  const dimensionX =
    shankEndX +
    Math.max(5, cuttingDiameter);


  // ==========================================================
  // VIEWBOX
  // ==========================================================

  const paddingX =
    Math.max(10, shankEndX * 0.05);


  const minX =
    -paddingX;


  const maxX =
    dimensionX + paddingX;


  const viewWidth =
    maxX - minX;


  // Берём максимальный диаметр,
  // чтобы и рабочая часть и хвостовик
  // полностью попадали в область.

  const maxRadius =
    Math.max(
      cuttingRadius,
      shankRadius
    );


  const paddingY =
    Math.max(10, maxRadius);


  const minY =
    -maxRadius - paddingY;


  const maxY =
    maxRadius + paddingY;


  const viewHeight =
    maxY - minY;


  // ==========================================================
  // VIEWBOX
  // ==========================================================

  svg.setAttribute(
    'viewBox',
    `${minX} ${minY} ${viewWidth} ${viewHeight}`
  );


  // ==========================================================
  // СЕТКА
  // ==========================================================

  gridBackground.setAttribute(
    'x',
    minX
  );

  gridBackground.setAttribute(
    'y',
    minY
  );

  gridBackground.setAttribute(
    'width',
    viewWidth
  );

  gridBackground.setAttribute(
    'height',
    viewHeight
  );


  // ==========================================================
  // КРАСНАЯ ОБЛАСТЬ
  //
  // Включает:
  // 1. вершину
  // 2. рабочую часть
  //
  // Высота = диаметр режущей части.
  // ==========================================================

  cuttingArea.setAttribute(
    'd',

    `
      M ${tipX} ${centerY}

      L ${shoulderX} ${-cuttingRadius}

      L ${workingEndX} ${-cuttingRadius}

      L ${workingEndX} ${cuttingRadius}

      L ${shoulderX} ${cuttingRadius}

      Z
    `
  );


  // ==========================================================
  // ЗЕЛЁНАЯ ОБЛАСТЬ
  //
  // Хвостовик имеет собственный диаметр.
  // ==========================================================

  shankArea.setAttribute(
    'd',

    `
      M ${workingEndX} ${-shankRadius}

      L ${shankEndX} ${-shankRadius}

      L ${shankEndX} ${shankRadius}

      L ${workingEndX} ${shankRadius}

      Z
    `
  );


  // ==========================================================
  // ВЕРХНЯЯ РЕЖУЩАЯ КРОМКА
  // ==========================================================

  edgeTop.setAttribute(
    'x1',
    tipX
  );

  edgeTop.setAttribute(
    'y1',
    centerY
  );

  edgeTop.setAttribute(
    'x2',
    shoulderX
  );

  edgeTop.setAttribute(
    'y2',
    -cuttingRadius
  );


  // ==========================================================
  // НИЖНЯЯ РЕЖУЩАЯ КРОМКА
  // ==========================================================

  edgeBottom.setAttribute(
    'x1',
    tipX
  );

  edgeBottom.setAttribute(
    'y1',
    centerY
  );

  edgeBottom.setAttribute(
    'x2',
    shoulderX
  );

  edgeBottom.setAttribute(
    'y2',
    cuttingRadius
  );


  // ==========================================================
  // ВЕРХ РАБОЧЕЙ ЧАСТИ
  // ==========================================================

  bodyTop.setAttribute(
    'x1',
    shoulderX
  );

  bodyTop.setAttribute(
    'y1',
    -cuttingRadius
  );

  bodyTop.setAttribute(
    'x2',
    workingEndX
  );

  bodyTop.setAttribute(
    'y2',
    -cuttingRadius
  );


  // ==========================================================
  // НИЗ РАБОЧЕЙ ЧАСТИ
  // ==========================================================

  bodyBottom.setAttribute(
    'x1',
    shoulderX
  );

  bodyBottom.setAttribute(
    'y1',
    cuttingRadius
  );

  bodyBottom.setAttribute(
    'x2',
    workingEndX
  );

  bodyBottom.setAttribute(
    'y2',
    cuttingRadius
  );


  // ==========================================================
  // ВЕРХ ХВОСТОВИКА
  // ==========================================================

  shankTop.setAttribute(
    'x1',
    workingEndX
  );

  shankTop.setAttribute(
    'y1',
    -shankRadius
  );

  shankTop.setAttribute(
    'x2',
    shankEndX
  );

  shankTop.setAttribute(
    'y2',
    -shankRadius
  );


  // ==========================================================
  // НИЗ ХВОСТОВИКА
  // ==========================================================

  shankBottom.setAttribute(
    'x1',
    workingEndX
  );

  shankBottom.setAttribute(
    'y1',
    shankRadius
  );

  shankBottom.setAttribute(
    'x2',
    shankEndX
  );

  shankBottom.setAttribute(
    'y2',
    shankRadius
  );


  // ==========================================================
  // РАЗМЕРНАЯ ЛИНИЯ
  // ==========================================================

  diameterLine.setAttribute(
    'x1',
    dimensionX
  );

  diameterLine.setAttribute(
    'y1',
    -cuttingRadius
  );

  diameterLine.setAttribute(
    'x2',
    dimensionX
  );

  diameterLine.setAttribute(
    'y2',
    cuttingRadius
  );


  // ==========================================================
  // ТЕКСТ ДИАМЕТРА
  // ==========================================================

  diameterText.setAttribute(
    'x',
    dimensionX + 2
  );

  diameterText.setAttribute(
    'y',
    1
  );

  diameterText.textContent =
    `Ø ${cuttingDiameter} мм`;

}


// ============================================================
// СОБЫТИЯ
// ============================================================

cuttingDiameterInput.addEventListener(
  'input',
  renderDrill
);


shankDiameterInput.addEventListener(
  'input',
  renderDrill
);


workingLengthInput.addEventListener(
  'input',
  renderDrill
);


shankLengthInput.addEventListener(
  'input',
  renderDrill
);


angleInput.addEventListener(
  'input',
  renderDrill
);


// ============================================================
// ЗАПУСК
// ============================================================

renderDrill();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конструктор сверла</title>
  <style>
    body {
      background-color: gray;
    }
    .container {
      margin: 100px auto 100px;
      max-width: 1200px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .svg-container {
      background-color: #fff;
      width: 100%;
      max-width: 1200px;
      height: 500px;
      border: 1px solid #ccc;
      overflow: hidden;
    }
    .svg-container svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .grid-line {
      stroke: #ddd;
      stroke-width: 0.2;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Конструктор сверла</h2>
    <div class="controls">
      <label>Масштаб<input id="scale" type="range" value="30" min="30" max="100" step="0.1"></label>
    </div>
    <div class="svg-container">
      <svg id="drill" viewBox="0 0 200 200">
        <!-- ===================================== DEFINITIONS ===================================== -->
        <defs>
          <!-- ================================= СЕТКА 5 × 5 ММ ================================= -->
          <pattern id="grid" width="5" height="5" patternUnits="userSpaceOnUse">
            <path d="M 0 0 L 5 0 L 5 5" fill="none" class="grid-line" />
          </pattern>
        </defs>
        <!-- ===================================== ФОН ===================================== -->
        <rect id="gridBackground" x="0" y="0" fill="url(#grid)" width="200" height="200"/>

      </svg>
    </div>
  </div>
  <script>
    const svg = document.querySelector('#drill');
    const zoomInput = document.querySelector('#scale');
    const gridBackground = document.querySelector('#gridBackground');
    const container = document.querySelector('.svg-container');

    function renderDrill() {
        const zoom = Number(zoomInput.value);

        const width = container.clientWidth / container.clientHeight * zoom;
        const height = container.clientHeight / container.clientHeight * zoom;

        const x = -width / 2;
        const y = -height / 2;

        svg.setAttribute('viewBox', `${x} ${y} ${width} ${height}`);
        gridBackground.setAttribute('x',x);
        gridBackground.setAttribute('y',y);
        gridBackground.setAttribute('width',width);
        gridBackground.setAttribute('height',height);
    }

    zoomInput.addEventListener('input',renderDrill);

    renderDrill();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конструктор сверла</title>
  <link rel="stylesheet" href="style.css">
  <style></style>
</head>
<body>
  <div class="container">
    <h2>Конструктор сверла</h2>
    <div class="controls">
      <label>Диаметр, мм<input id="diameter" type="range" value="10" min="1" max="30" step="0.1"></label>
      <label>Длина рабочей части, мм<input id="workingLength" type="range" value="50" min="1" max="85" step="1"></label>
      <label>Длина хвостовика, мм<input id="shankLength" type="range" value="50" min="1" max="85" step="1"></label>
      <label>Угол заточки, °<input id="angle" type="range" value="118" min="45" max="179" step="1"></label>
      <!-- <label>Масштаб<input id="scale" type="range" value="30" min="30" max="100" step="0.1"></label> -->
    </div>
    <div class="svg-container">
      <svg id="drill" viewBox="-10 -20 170 40" preserveAspectRatio="xMidYMid meet" >
        <!-- Центральная ось -->
        <line id="axis" class="axis" x1="-30" y1="0" x2="170" y2="0" />
        <!-- Верхняя режущая кромка -->
        <line id="edgeTop" x1="-10" y1="0" x2="0" y2="-10" class="drill" />
        <!-- Нижняя режущая кромка -->
        <line id="edgeBottom" x1="-10" y1="0" x2="0" y2="10" class="drill" />
        <!-- Верхняя сторона рабочей части -->
        <line id="bodyTop" x1="-65" y1="-10" x2="0" y2="-10" class="drill" />
        <!-- Нижняя сторона рабочей части -->
        <line id="bodyBottom" x1="-65" y1="10" x2="0" y2="10" class="drill" />
        <!-- Верх хвостовика -->
        <line id="shankTop" x1="0" y1="-10" x2="65" y2="-10" class="drill" />
        <!-- Низ хвостовика -->
        <line id="shankBottom" x1="0" y1="10" x2="65" y2="10" class="drill" />
        <!-- Размер диаметра -->
        <line id="diameterLine" x1="140" y1="10" x2="140" y2="-10" class="dimension" />
        <text id="diameterText" x="143" y="0">Ø 10 мм</text>
      </svg>

        <rect id="gridBackground" x="0" y="0" fill="url(#grid)" width="200" height="200"/>
      </svg> -->
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
